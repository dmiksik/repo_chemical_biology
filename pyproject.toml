[project]
name = "new_repo_chem_bio"
version = "1.0.0"
description = "Repository for Chemical Biology Data"
packages = []
authors = []
dependencies = [
    "oarepo[s3,rdm]>=14.0.0b1,<15.0.0",
    "oarepo-app[ccmm,production]>=6.3.0,<7.0.0",
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_dataset = "ui.dataset.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_dataset = "ui.dataset:create_blueprint"

[project.entry-points."invenio_base.api_blueprints"]
spectra = "common.spectra.views:create_blueprint"

[project.entry-points."invenio_celery.tasks"]
spectra = "common.spectra.tasks"

[project.entry-points."invenio_db.models"]
spectra = "common.spectra.models"

[project.entry-points."invenio_base.finalize_app"]
ui_dataset = "ui.dataset:finalize_app"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "models",
]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"
